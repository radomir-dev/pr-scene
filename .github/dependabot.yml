version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore: # majors blocked by the Node 22 runtime or typedoc's peer range
      - dependency-name: "semantic-release"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*", "vitest", "@vitest/*", "@vitest/browser*"]
      release:
        patterns: ["semantic-release", "@semantic-release/*", "@commitlint/*"]
      tooling:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "knip"
          - "publint"
          - "@arethetypeswrong/*"
          - "size-limit"
          - "@size-limit/*"
          - "dependency-cruiser"
          - "typedoc"
          - "typedoc-plugin-markdown"
          - "lefthook"
          - "lint-staged"
      testing:
        patterns: ["@playwright/test", "jsdom", "@vitest/coverage-v8"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
