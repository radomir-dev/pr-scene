name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate the API reference
        run: npm run docs
      - name: Commit the reference when it moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet docs/api; then
            echo "docs are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git commit -m "docs: regenerate the api reference [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Read the released version
        id: version
        run: |
          git fetch --tags --force
          version=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the site with the released version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:demo
      - name: Build Storybook with the released version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:storybook
      - name: Put Storybook inside the site
        run: |
          mkdir -p dist-demo/storybook
          cp -r storybook-static/. dist-demo/storybook/
          touch dist-demo/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: dist-demo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy v$VERSION"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check what would be released
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run
