name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate the API reference
        run: npm run docs
      - name: Commit the reference when it moved
        run: |
          if git diff --quiet docs/api; then
            echo "docs are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git commit -m "docs: regenerate the api reference [skip ci]"
          git push
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Read the released version
        id: version
        run: |
          git fetch --tags --force
          version=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the site with the released version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:demo
      - name: Build Storybook with the released version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:storybook
      - name: Put Storybook inside the site
        run: |
          mkdir -p dist-demo/storybook
          cp -r storybook-static/. dist-demo/storybook/

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check what would be released
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run
