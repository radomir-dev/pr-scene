name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the released version
        id: version
        run: echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Build the site
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:demo
      - name: Build Storybook
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:storybook
      - name: Assemble the deploy directory
        run: |
          mkdir -p dist-demo/storybook
          cp -r storybook-static/. dist-demo/storybook/
          touch dist-demo/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: dist-demo
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy v$VERSION"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
