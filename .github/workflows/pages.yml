name: pages

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the released version
        id: version
        run: echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Build the site
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:demo
      - name: Build Storybook
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:storybook
      - name: Assemble the deploy directory
        run: |
          mkdir -p dist-demo/storybook
          cp -r storybook-static/. dist-demo/storybook/
          touch dist-demo/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: dist-demo
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy v$VERSION"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
