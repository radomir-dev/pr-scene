name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - name: Build the demo for the preview path
        if: github.event.action != 'closed'
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
        run: npm run build:demo
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist-demo
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          pages-base-url: radomir.dev/pr-scene
          qr-code: false
